services:
  doxie-scanner:
    image: doxie-scanner:local
    build: .
    ports:
      - "8080:8080"
    env_file:
      # DOXIE_PAPERLESS_URL and DOXIE_PAPERLESS_TOKEN; see .env.example.
      - path: .env
        required: false
    volumes:
      # Scans live here. Without this bind mount they are lost whenever
      # the container is recreated.
      - ./data:/data
      # Scan names use the local time, so share the host's time zone.
      - /etc/localtime:/etc/localtime:ro
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      # 189 is the USB major number. The wildcard minor keeps working
      # when the scanner gets a new device number after being switched
      # off and on, which a plain `devices:` entry would not (see
      # README.md, "USB access").
      - "c 189:* rmw"
    restart: unless-stopped
